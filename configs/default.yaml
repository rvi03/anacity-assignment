# Sole definition of dataset shape.
# Nothing here may be hardcoded a second time: the facility catalog below
# is the categorical enum used everywhere downstream.
#
# Conventions (schema-tested in tests/test_config.py):
#   available_from_month  zero-based elapsed-month index from start_date
#   hours                 half-open interval [open_hour, close_hour)
seed: 20260811
timezone: Asia/Kolkata
community:
  residents: 500
  months: 24
  start_date: 2024-01-01
facilities:                     # names are the enum, everywhere
  # popularity/hours/available_from_month are the
  # weekend_multiplier/lead_*/slot_capacity are the facility
  # behaviour the generator draws from — same catalog, one place.
  - name: Gym
    popularity: 0.26
    hours: [5, 22]
    available_from_month: 0
    weekend_multiplier: 0.75
    lead_hours_median: 8
    lead_log_sigma: 0.7
    slot_capacity: 5
  - name: Pool
    popularity: 0.17
    hours: [6, 21]
    available_from_month: 0
    weekend_multiplier: 1.30
    lead_hours_median: 12
    lead_log_sigma: 0.7
    slot_capacity: 4
  - name: Badminton
    popularity: 0.13
    hours: [6, 22]
    available_from_month: 0
    weekend_multiplier: 1.20
    lead_hours_median: 24
    lead_log_sigma: 0.8
    slot_capacity: 2
  - name: Tennis
    popularity: 0.11
    hours: [6, 21]
    available_from_month: 0
    weekend_multiplier: 1.20
    lead_hours_median: 24
    lead_log_sigma: 0.8
    slot_capacity: 2
  - name: Basketball
    popularity: 0.09
    hours: [6, 22]
    available_from_month: 0
    weekend_multiplier: 1.30
    lead_hours_median: 20
    lead_log_sigma: 0.8
    slot_capacity: 3
  - name: Clubhouse
    popularity: 0.09
    hours: [8, 23]
    available_from_month: 0
    weekend_multiplier: 1.80
    lead_hours_median: 72
    lead_log_sigma: 0.9
    slot_capacity: 2
  - name: Multipurpose Hall
    popularity: 0.08
    hours: [8, 23]
    available_from_month: 0
    weekend_multiplier: 2.00
    lead_hours_median: 120
    lead_log_sigma: 0.9
    slot_capacity: 1
  - name: Yoga Room
    popularity: 0.07
    hours: [5, 20]
    available_from_month: 8
    weekend_multiplier: 0.90
    lead_hours_median: 10
    lead_log_sigma: 0.7
    slot_capacity: 3
generator:                      #; generator-only
  noise_fraction: 0.08                # drawn from popularity, not preference
  jitter_minutes: 30                  # +/- before snapping to a bookable hour
  min_lead_minutes: 30                # floor, so booking_ts < usage_ts always
  displacement_search_hours: 3        # second-choice hour when full
  capacity_pressure_slack: 1          # free seats still counted as nearly full
  hour_draw_attempts: 8               # tries at the preferred hour band
  capacity_lead_multiplier: 1.6       # pressure pushes booking earlier
  resident_lead_log_sigma: 0.30       # per-resident lead-time variability
  acceptance:                         # a property with no threshold is a
    enforce: true                    # a failed check stops the pipeline
    lead_p50_hours: [6, 72]           # hope, not a check
    long_lead_facility: Multipurpose Hall
    short_lead_facility: Gym
    long_lead_ratio: 2.0
    active_resident_bookings: 5
    primary_share_min: 0.35
    primary_share_excess: 0.10        # over that facility's community share
    time_pattern_excess: 0.10
    morning_archetype: Early Fitness
    weekend_archetype: Weekend Family
    imbalance_ratio: 2.0              # most-used vs least-used available
    noise_share: [0.06, 0.10]         # realised, against the configured 8%
    absorption_drop: 0.05
    resample_distance: 0.05           # Jensen-Shannon, pre vs post
    sparse_resident_bookings: 5
    sparse_share_min: 0.15
    top_facilities: 3                 # realised vs configured, same order
  drift:                              # dated behaviour changes, so they
    absorbing_facility: Yoga Room     # can be sliced rather than assumed
    absorbed_facility: Gym
    absorbing_archetype: Early Fitness
    absorption: 0.20                  # of that archetype's Gym preference
    resample_month: 14                # life change: new habits, same person
    resample_share: 0.15
    season:
      facility: Pool
      amplitude: 0.35                 # summer up, monsoon down
      peak_month: 4
  join:
    early_share: 0.80                 # rest join later -> short histories
  activity:                           # zero-inflated negative binomial
    zero_inflation: 0.15
    classes:
      - {name: sparse,     share: 0.20, weekly_mean: 0.04, dispersion: 0.8}
      - {name: occasional, share: 0.30, weekly_mean: 0.25, dispersion: 1.2}
      - {name: regular,    share: 0.32, weekly_mean: 0.70, dispersion: 2.0}
      - {name: frequent,   share: 0.18, weekly_mean: 1.60, dispersion: 3.0}
  consistency:                        # weight on personal preference
    low: 0.55
    high: 0.95
  preference:
    dirichlet_concentration: 0.35     # < 1 -> one or two dominant facilities
    primary_boost: 6.0                # alpha added for archetype facilities
    recency_boost: 1.4                # "recent behaviour"
  archetypes:
    - name: Early Fitness
      share: 0.22
      facilities: [Gym, Yoga Room]
      hour_center: 6.5
      hour_spread: 1.2
      weekend_share: 0.20
      lead_scale: 0.7
    - name: Evening Sports
      share: 0.20
      facilities: [Badminton, Tennis, Basketball]
      hour_center: 19.5
      hour_spread: 1.5
      weekend_share: 0.35
      lead_scale: 1.0
    - name: Swimmer
      share: 0.15
      facilities: [Pool, Gym]
      hour_center: 7.5
      hour_spread: 2.0
      weekend_share: 0.30
      lead_scale: 0.9
    - name: Weekend Family
      share: 0.18
      facilities: [Clubhouse, Basketball]
      hour_center: 11.0
      hour_spread: 3.0
      weekend_share: 0.75
      lead_scale: 1.3
    - name: Event Host
      share: 0.10
      facilities: [Multipurpose Hall, Clubhouse]
      hour_center: 18.0
      hour_spread: 3.0
      weekend_share: 0.60
      lead_scale: 2.0
    - name: Sporadic
      share: 0.15
      facilities: []
      hour_center: 17.0
      hour_spread: 4.0
      weekend_share: 0.30
      lead_scale: 1.0
storage:
  # Connection settings for the store of record. The password is not
  # here: it is read from the environment variable named below, which
  # `.env` supplies for local runs.
  driver: postgresql+psycopg
  host: localhost
  port: 5432
  user: facility
  database: facility
  password_env: POSTGRES_PASSWORD

tracking:
  # A mirror of the pipeline, never the source of a result. Turning this
  # off must change no artifact — that is what makes an offline replay
  # possible without a server running.
  enabled: true
  experiment: facility-usage-prediction   # one experiment, both tracks
  tracking_uri_env: MLFLOW_TRACKING_URI   # `.env` supplies it locally
  prompt_alias: champion                  # alias naming the live version

split:
  # fractions of elapsed target-time span, not of row counts
  train_frac: 0.70
  val_frac:   0.15
  embargo_days: 0        # 3 days is a validation-only sensitivity
  comparison_rows: 500   # seeded holdout rows both tracks are compared on
evaluation:
  notification_match_ratio: 1.25   # symmetric multiplicative +/-25%
  notification_support_minutes: [30, 60, 180]
  min_prior_bookings: 1
application:
  notification_lead_minutes: 120        # display only; never scored
review:
  history_rows: 3        # "Past bookings" depth; display only
features:
  # Feature definitions do not vary with dataset scale, so smoke.yaml
  # carries this block unchanged: a smoke run must exercise the same
  # columns the headline run is measured on.
  categorical_missing_token: __MISSING__
  history_facility_slots: 3         # last 1..N facilities, each its own column
  prior_windows_days: [7, 30, 90, 180]
  trend_windows_days: [30, 90]      # short / long booking-rate ratio
  rolling_preference_bookings: [3, 5, 10]
  ewma_halflife_days: 30            # preference decay; 60 is a stretch variant
  community_windows_days: [30, 90]  # rolling community popularity, strictly
                                    # earlier than the origin
  time_bands:                       # half-open [open, close); must tile [0,24)
    - {name: night,     hours: [0, 6]}
    - {name: morning,   hours: [6, 12]}
    - {name: afternoon, hours: [12, 17]}
    - {name: evening,   hours: [17, 21]}
    - {name: late,      hours: [21, 24]}
catboost:
  task_type: CPU
  thread_count: 10
  random_seed_from_root: true
  iterations: 1500                      # ceiling; the inner search picks below it
  iteration_search: true                # per-head count, chosen on training rows only
  inner_validation_frac: 0.15           # latest slice of the training rows
  inner_od_wait: 150
  depth: 6
  learning_rate: 0.08
  l2_leaf_reg: 7
  use_best_model: false
  allow_writing_files: false
  stretch_fit_budget: 25                # validation-only fits after the freeze
  notification_bucket_ratio: 1.5        # finite bucket fits within the x1.25 match rule
  notification_bucket_floor_minutes: 60
  notification_bucket_ceiling_days: 100
  notification_decode: window           # heaviest tolerance window, not argmax bucket
  bootstrap:                                  # pinned per head, not globally
    notification: {type: MVS}                 # notification bucket classifier
    # facility / day / hour heads, MultiClass
    classifiers:  {type: Bernoulli, subsample: 0.8}

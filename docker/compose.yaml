# Local service stack: the store of record plus the experiment tracker.
#
# Postgres holds two application databases and MLflow's backend store.
# MLflow runs as a server so the prompt registry and the trace viewer are
# usable surfaces rather than a file someone has to open with a library.
#
# Every value has an inline default, so `docker compose up` works with no
# `.env` file. Copy `.env.example` to `.env` to override any of them; that
# file is the single place both this stack and the application read
# connection settings from.
name: facility-prediction

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-facility}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-facility_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-facility}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 keeps its cluster under /var/lib/postgresql/18/docker,
      # and the image declares /var/lib/postgresql as the volume. Mounting
      # the older /var/lib/postgresql/data would silently lose the data.
      - pgdata:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  mlflow:
    build:
      context: .
      dockerfile: mlflow.Dockerfile
    image: facility-prediction/mlflow:3.15.1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://${POSTGRES_USER:-facility}:${POSTGRES_PASSWORD:-facility_local_dev}@postgres:5432/mlflow
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=${MLFLOW_BACKEND_STORE_URI:-postgresql+psycopg2://facility:facility_local_dev@postgres:5432/mlflow}
      - --artifacts-destination=/mlartifacts
      - --serve-artifacts
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlartifacts:/mlartifacts
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request as r; r.urlopen('http://localhost:5000/health')"
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
  mlartifacts:

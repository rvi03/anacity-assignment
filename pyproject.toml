[project]
name = "facility-prediction"
version = "0.1.0"
description = "Facility usage prediction on a synthetic community dataset."
requires-python = ">=3.11,<3.13"
dependencies = [
  "alembic>=1.13",
  "catboost>=1.2.7",
  "huggingface-hub>=0.34",
  "mlflow==3.15.1",
  # Metal-only wheels: the constrained-decoding path runs on the host
  # GPU, so it is installed on Apple Silicon and nowhere else.
  "mlx-lm==0.31.3 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
  # Generator rigour plots. Present transitively through mlflow, but a
  # transitive version is not a pin — the plots are a deliverable.
  "matplotlib>=3.8",
  "numpy>=1.26",
  "outlines[mlxlm]==1.3.3 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "pandera>=0.29",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
  "hypothesis>=6.100",
  "mypy>=1.11",
  "pytest>=8.2",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/facility_prediction"]

[tool.ruff]
# Google style guide §3.2: a hard limit, not a suggestion
line-length = 80
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".docs"]             # plan/archive prose, not project source

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "D", "N", "UP", "B", "A", "C4", "SIM",
  "ARG", "PTH", "RET", "PL", "RUF", "ANN", "DTZ", "NPY", "PD", "T20",
]
ignore = [
  "D203", "D213",   # incompatible with the google convention's D211/D212
  "ANN401",         # `Any` is permitted where the guide permits it
  "PLR0913",        # arg count judged per §3.18, not by a fixed number
]

[tool.ruff.lint.pydocstyle]
convention = "google"                  # Google §3.8 docstring sections

[tool.ruff.lint.isort]
known-first-party = ["facility_prediction"]
force-sort-within-sections = true
# Google style guide §3.13 sorts lexicographically, ignoring case
order-by-type = false

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.ruff.lint.per-file-ignores]
# magic numbers are the point of a fixture; `**` so a track's own test
# directory is covered by the same rule as the shared ones
"tests/**" = ["D", "ANN", "PLR2004"]
# Alembic writes these; its header docstring is the revision record, and
# reformatting generated files would be undone by the next autogenerate
"migrations/versions/*" = ["D"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
